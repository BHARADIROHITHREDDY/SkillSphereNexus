<header class="topbar">
  <a class="brand" routerLink="/dashboard">SkillSphere <span>Nexus</span></a>
  <nav aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a *ngIf="canManageEmployees()" routerLink="/employees" routerLinkActive="active">Employees</a>
    <a routerLink="/skills" routerLinkActive="active">Skills</a>
    <a routerLink="/learning" routerLinkActive="active">Learning</a>
    <a routerLink="/certifications" routerLinkActive="active">Certifications</a>
    <a routerLink="/career" routerLinkActive="active">Career</a>
    <a routerLink="/jobs" routerLinkActive="active">Jobs</a>
    <a *ngIf="canViewAnalytics()" routerLink="/analytics" routerLinkActive="active">Analytics</a>
  </nav>
  <button *ngIf="auth.isLoggedIn()" class="logout" (click)="auth.logout()">Logout</button>
</header>
<main class="app-content"><router-outlet></router-outlet></main>
